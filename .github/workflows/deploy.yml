name: Deploy
on:
  push:
    branches:
      - "main"
      - "develop"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CAPTURE_ACV_EMAIL: ${{ secrets.CAPTURE_ACV_EMAIL }}
          CAPTURE_ACV_PASSWORD: ${{ secrets.CAPTURE_ACV_PASSWORD }}
          MAILER_EMAIL: ${{ secrets.MAILER_EMAIL }}
          MAILER_PASSWORD: ${{ secrets.MAILER_PASSWORD }}
          DEFAULT_IMPACT_METHOD_UUID: ${{ secrets.DEFAULT_IMPACT_METHOD_UUID }}
          CALC_API_KEY: ${{ secrets.CALC_API_KEY }}
          BACKUP_S3_ENABLED: "true"
          BACKUP_LOCAL_ENABLED: "true"
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: 22
          envs: DB_USER,DB_PASSWORD,JWT_SECRET,OPENROUTER_API_KEY,CAPTURE_ACV_EMAIL,CAPTURE_ACV_PASSWORD,MAILER_EMAIL,MAILER_PASSWORD,DEFAULT_IMPACT_METHOD_UUID,CALC_API_KEY,BACKUP_S3_ENABLED,BACKUP_LOCAL_ENABLED,BACKUP_S3_ENDPOINT,BACKUP_S3_REGION,BACKUP_S3_BUCKET,BACKUP_S3_ACCESS_KEY_ID,BACKUP_S3_SECRET_ACCESS_KEY
          script: |
            set -euo pipefail
            
            REPO_URL="git@acvcompare:${{ github.repository }}.git"
            BRANCH=${{ github.ref_name }}
            DEPLOY_DIR="$HOME/openlca/${{ github.event.repository.name }}"
            
            if [ -d "${DEPLOY_DIR}/.git" ]; then
              cd "${DEPLOY_DIR}"
              git fetch --prune origin "+refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
              git checkout "${BRANCH}" || git checkout -B "${BRANCH}" "origin/${BRANCH}"
              git reset --hard "origin/${BRANCH}"
            else
              mkdir -p "$(dirname "${DEPLOY_DIR}")"
              git clone --branch "${BRANCH}" --depth 1 "${REPO_URL}" "${DEPLOY_DIR}"
              cd "${DEPLOY_DIR}"
            fi
            
            cd "${DEPLOY_DIR}"
            docker compose --profile prod up -d --build --remove-orphans
            for attempt in $(seq 1 30); do
              if docker compose exec -T db pg_isready -U "$DB_USER" -d acv; then
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                docker compose logs db
                exit 1
              fi
              sleep 2
            done
            docker compose exec -T lca-compare-backend pnpm --filter server prisma:db:push
