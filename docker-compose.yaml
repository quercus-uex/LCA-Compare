services:
  lca-compare-backend:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/acv"
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      CAPTURE_ACV_EMAIL: ${CAPTURE_ACV_EMAIL}
      CAPTURE_ACV_PASSWORD: ${CAPTURE_ACV_PASSWORD}
      MAILER_EMAIL: ${MAILER_EMAIL}
      MAILER_PASSWORD: ${MAILER_PASSWORD}
      DEFAULT_IMPACT_METHOD_UUID: ${DEFAULT_IMPACT_METHOD_UUID}
    depends_on:
      - db
    networks:
      lca-compare:
      olca:
    profiles:
      - prod
    restart: unless-stopped

  lca-compare-frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "80:80"
    environment:
      CALC_API_KEY: ${CALC_API_KEY}
    depends_on:
      - lca-compare-backend
    networks:
      lca-compare:
      olca:
    profiles:
      - prod
    restart: unless-stopped

  db:
    container_name: db
    image: postgis/postgis:17-master
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: acv
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      lca-compare:
    restart: unless-stopped

volumes:
  postgres:

networks:
  lca-compare:
  olca:
    external: true