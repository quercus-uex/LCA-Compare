services:
  acv-compare-backend:
    build:
      context: ./
      dockerfile: Dockerfile
    ports:
      - "8080:3000"
    environment:
      DATABASE_URL: "postgres://${DB_USER}:${DB_PASSWORD}@db:5432/postgres"
      JWT_SECRET: ${JWT_SECRET}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      VENTUM_ACV_EMAIL: ${VENTUM_ACV_EMAIL}
      VENTUM_ACV_PASSWORD: ${VENTUM_ACV_PASSWORD}
    depends_on:
      - db
    networks:
      acv-compare:
      olca:
    profiles:
      - prod

  acv-compare-frontend:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - acv-compare-backend
    networks:
      acv-compare:
      olca:
    profiles:
      - prod

  db:
    container_name: db
    image: postgis/postgis:17-master
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - 5432:5432
    networks:
      acv-compare:

volumes:
  postgres:

networks:
  acv-compare:
  olca:
    external: true