sonar.projectKey=quercus_acv_compare
sonar.organization=rdereparadores


# This is the name and version displayed in the SonarCloud UI.
#sonar.projectName=ACV Compare
#sonar.projectVersion=1.0


# Path is relative to the sonar-project.properties file. Replace "\" by "/" on Windows.
sonar.sources=apps/server/src
sonar.tests=apps/server/src
sonar.test.inclusions=apps/server/src/**/*.spec.ts
sonar.exclusions=apps/server/src/**/*.spec.ts,apps/server/src/generated/**,apps/server/dist/**,apps/server/node_modules/**
sonar.javascript.lcov.reportPaths=apps/server/coverage/lcov.info
sonar.testExecutionReportPaths=apps/server/coverage/sonar-test-report.xml

# Encoding of the source code. Default is default system encoding
sonar.sourceEncoding=UTF-8
